xt><text x="522" y="278" class="m h">Password Checker</text><text x="522" y="302" class="m t">Checks password strength</text><text x="522" y="318" class="m t">against best practices</text><line x1="522" y1="340" x2="722" y2="340" stroke="#27272a"/><text x="522" y="360" class="m tag">Python</text><rect x="750" y="216" width="232" height="156" rx="8" fill="#18181b" stroke="#27272a" stroke-dasharray="5 5"/><path d="M750 225V216H759 M973 216H982V225 M982 363V372H973 M759 372H750V363" fill="none" stroke="#c5a059" stroke-width="1.5" opacity=".85"/><text x="766" y="244" class="m tag gold">NEXT CASE</text><rect x="914" y="230" width="52" height="18" rx="9" fill="none" stroke="#c5a059"/><text x="940" y="242" text-anchor="middle" class="m" font-size="9" letter-spacing="1.5" fill="#c5a059">OPEN</text><text x="766" y="278" class="m h">Web App Pentesting</text><text x="766" y="302" class="m t">Bug bounty challenges and</text><text x="766" y="318" class="m t">web app penetration testing</text><line x1="766" y1="340" x2="966" y2="340" stroke="#27272a"/><text x="766" y="360" class="m tag">In progress</text>
