<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Mission board: three open objectives and three cleared">
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".025"/></pattern></defs>
<style>
.m{font-family:'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Courier New',monospace}
.tag{font-size:10px;letter-spacing:2px;fill:#71717a}
.h{font-size:15px;font-weight:700;fill:#f4f4f5}
.t{font-size:11px;fill:#a1a1aa}
.s{font-size:12px;fill:#d4d4d8}
.k{font-size:10px;letter-spacing:2px;fill:#71717a}
.v{font-size:14px;fill:#f4f4f5}
.h2{font-size:12px;font-weight:700;fill:#f4f4f5}
.q{font-size:12px;font-style:italic;fill:#a1a1aa}
.gold{fill:#c5a059}
.soft{fill:#d4d4d8}
.blink{animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.dash{stroke-dasharray:5 7;animation:mv 2.4s linear infinite}
@keyframes mv{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.blink,.dash{animation:none}}
</style>
<rect width="1000" height="230" rx="12" fill="#09090b"/><rect width="1000" height="230" rx="12" fill="url(#scan)"/>
<text x="18" y="30" class="m tag gold">MISSION BOARD  //  CURRENT OBJECTIVES</text><rect x="14" y="46" width="480" height="168" rx="8" fill="#18181b" stroke="#27272a"/><path d="M14 55V46H23 M485 46H494V55 M494 205V214H485 M23 214H14V205" fill="none" stroke="#c5a059" stroke-width="1.5" opacity=".85"/><text x="34" y="76" class="m tag gold">OPEN</text><rect x="34" y="99" width="16" height="16" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/><text x="64" y="112" class="m s">Master web application penetration testing</text><rect x="34" y="133" width="16" height="16" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/><text x="64" y="146" class="m s">Complete bug bounty challenges</text><rect x="34" y="167" width="16" height="16" rx="3" fill="none" stroke="#71717a" stroke-width="1.5"/><text x="64" y="180" class="m s">Earn CEH / eJPT certification</text><rect x="506" y="46" width="480" height="168" rx="8" fill="#18181b" stroke="#27272a"/><path d="M506 55V46H515 M977 46H986V55 M986 205V214H977 M515 214H506V205" fill="none" stroke="#c5a059" stroke-width="1.5" opacity=".85"/><text x="526" y="76" class="m tag gold">CLEARED</text><rect x="526" y="99" width="16" height="16" rx="3" fill="#c5a059"/><path d="M530 107l4 4l7-8" fill="none" stroke="#09090b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="112" class="m s">Build real-world security tools with Python</text><rect x="526" y="133" width="16" height="16" rx="3" fill="#c5a059"/><path d="M530 141l4 4l7-8" fill="none" stroke="#09090b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="146" class="m s">Participate in CTF competitions</text><rect x="526" y="167" width="16" height="16" rx="3" fill="#c5a059"/><path d="M530 175l4 4l7-8" fill="none" stroke="#09090b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="180" class="m s">Complete multiple industry job simulations</text>
<rect x=".5" y=".5" width="999" height="229" rx="12" fill="none" stroke="#27272a"/>
</svg>
