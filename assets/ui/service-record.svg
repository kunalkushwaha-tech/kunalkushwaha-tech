<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Service record: CodeAlpha, InterSpark, EduSkills AICTE, Techfest IIT Bombay">
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".025"/></pattern></defs>
<style>
.m{font-family:'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Courier New',monospace}
.tag{font-size:10px;letter-spacing:2px;fill:#71717a}
.h{font-size:15px;font-weight:700;fill:#f4f4f5}
.t{font-size:11px;fill:#a1a1aa}
.s{font-size:12px;fill:#d4d4d8}
.k{font-size:10px;letter-spacing:2px;fill:#71717a}
.v{font-size:14px;fill:#f4f4f5}
.h2{font-size:12px;font-weight:700;fill:#f4f4f5}
.q{font-size:12px;font-style:italic;fill:#a1a1aa}
.gold{fill:#c5a059}
.soft{fill:#d4d4d8}
.blink{animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.dash{stroke-dasharray:5 7;animation:mv 2.4s linear infinite}
@keyframes mv{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.blink,.dash{animation:none}}
</style>
<rect width="1000" height="460" rx="12" fill="#09090b"/><rect width="1000" height="460" rx="12" fill="url(#scan)"/>
